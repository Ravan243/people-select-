<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Seçim Et</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f9f7f7, #dbe2ef);
      text-align: center;
      padding: 20px;
    }

    h2 {
      color: #112D4E;
    }

    #peopleGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 30px auto;
    }

    .person {
      background: white;
      border-radius: 15px;
      padding: 15px;
      transition: transform 0.3s ease, box-shadow 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .person:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .person img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    #result {
      margin-top: 30px;
      font-size: 20px;
      color: #3F72AF;
    }

    #orderForm {
      margin-top: 20px;
      display: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3F72AF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2b567f;
    }
  </style>
</head>
<body>

<h2>Seç birini:</h2>
<div id="peopleGrid"></div>
<div id="result"></div>

<form id="orderForm" action="https://formspree.io/f/xkndajqa" method="POST">
  <input type="hidden" name="chosen_person" id="chosenPerson">
  <button type="submit">Sifariş et</button>
</form>

<script>
const names = [
  "Əsmər", "Zəhra", "Banu", "Məryəm", "Tərlan",
  "Afət", "Hüsniyyə", "Nurcan", "Bahar", "Nərgiz",
  "Tağızadə Nərmin", "Nülufər", "Nuray"
];

const grid = document.getElementById('peopleGrid');
const result = document.getElementById('result');
const orderForm = document.getElementById('orderForm');
const chosenPersonInput = document.getElementById('chosenPerson');

names.forEach(name => {
  const div = document.createElement('div');
  div.className = 'person';
  div.innerHTML = `<img src="https://via.placeholder.com/80?text=${name[0]}" alt="${name}"><p>${name}</p>`;
  div.onclick = () => {
    result.innerHTML = `Sən seçdin: <b>${name}</b> <br><span style="font-size: 30px;">🎉</span>`;
    chosenPersonInput.value = name;
    orderForm.style.display = 'block';
  };
  grid.appendChild(div);
});
</script>

</body>
</html>
