<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор человека</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #peopleGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; margin: auto; }
    .person { border: 1px solid #ccc; padding: 10px; border-radius: 10px; cursor: pointer; }
    .person img { border-radius: 50%; }
  </style>
</head>
<body>

<h2>Выбери человека:</h2>
<div id="peopleGrid"></div>
<div id="result" style="margin-top: 20px; font-size: 20px;"></div>

<script>
const names = ["Алиса","Максим","София","Нурай","Эмиль","Аделина","Илья","Лейла","Роман","Камила","Денис","Айла","Тимур","Элина","Арсен","Жасмина","Аслан","Мария"];
const grid = document.getElementById('peopleGrid');
const result = document.getElementById('result');

names.forEach(name => {
  const div = document.createElement('div');
  div.className = 'person';
  div.innerHTML = `<img src="https://via.placeholder.com/80?text=${name[0]}" alt="${name}"><p>${name}</p>`;
  div.onclick = () => {
    result.innerHTML = `Вы выбрали: <b>${name}</b><br><span style="font-size: 30px">🎉🎉🎉</span>`;
  };
  grid.appendChild(div);
});
</script>

</body>
</html>
